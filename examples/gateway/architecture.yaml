# yaml-language-server: $schema=../../plugin/schema/architecture.schema.json
#
# rmx-mower-gateway's target architecture, transcribed from its wiki page
# Mower-Gateway-Architecture §3 (layers and target graph), §1.2 (tasks) and the
# repo's CLAUDE.md (hardware), at commit 725a2ce. Not invented: where §3 is
# silent (e.g. dependencies of monitor, gw_tasks), the edge is left out.
# `sources` map each module to its files in main/ at that commit.
# It is the target architecture, not the code now: the code's cell -> usage include (upward)
# is left out and shows only in --as-is; how cell reports bytes to usage is an open decision.
version: 1
system:
  name: rmx-mower-gateway
  description: ESP32 + SIM7600G-H board that links the mower's autopilot to rmx-server over LTE (MQTT over TLS) and relays NTRIP corrections.

context:
  actors:
    - { id: rmx_server, kind: system, description: Broker and server app at mqtt.rmx.lt:8883 }
    - { id: ntrip_caster, kind: system, description: NTRIP caster for RTK corrections }
    - { id: autopilot, kind: device, description: Mower autopilot board on the board link }
    - { id: installer, kind: person, description: Provisions the device certificate over the serial console }
    - { id: operator, kind: person, description: Sends commands from a browser through the server's HTTP API (app.rmx.lt) }
  flows:
    - { from: system, to: rmx_server, data: "state, telemetry" }
    - { from: rmx_server, to: system, data: "commands, firmware" }
    - { from: system, to: ntrip_caster, data: GGA }
    - { from: ntrip_caster, to: system, data: RTCM }
    - { from: autopilot, to: system, data: "frames, GGA" }
    - { from: system, to: autopilot, data: "corrections, frames" }
    - { from: installer, to: system, data: certificate }
    - { from: operator, to: rmx_server, data: commands }

hardware:
  processor: ESP32-WROVER-E
  # N16R8 module (esp-knowledge hub, boards/t-sim7600.md); its memories sit on the internal SPI0/1 bus
  description: The ESP32-WROVER-E module has integrated 16 MB flash and 8 MB PSRAM.
  buses:
    # UART1: esp_modem 2.1.0's default DTE config, which main/cell.c keeps
    - { id: uart_modem, kind: uart, peripheral: UART1, description: "Modem UART, TX 27 RX 26, no flow control" }
    - { id: uart2_board, kind: uart, peripheral: UART2, description: UART2 with RTS/CTS to the autopilot }
    - { id: uart0_console, kind: uart, peripheral: UART0, description: UART0 provisioning console }
    - { id: gpio_board, kind: gpio, description: "PWRKEY 4, FLIGHT 25, DTR 32, STATUS in, status LED" }
  devices:
    - { id: sim7600, name: SIM7600 modem, bus: [uart_modem, gpio_board], description: SIM7600G-H LTE modem }
    - { id: user_led, name: user LED, bus: gpio_board, description: Blue user LED on GPIO12 }
    - { id: autopilot_board, name: autopilot board, bus: uart2_board, description: "Mower autopilot board (link planned, rmx-mower-gateway#62)" }
    - { id: ch9102, name: USB-UART bridge, bus: uart0_console, description: USB-UART bridge to the provisioning PC }

subsystems:
  - { id: cellular, description: "LTE modem, PPP and its pins" }
  - { id: server_link, description: "MQTT to rmx-server: certificate, commands, OTA, telemetry, byte counts" }
  - { id: autopilot_link, description: "Board link to the autopilot and the NTRIP corrections it carries" }
  - { id: app, description: "Init order, supervisor and gateway state" }
  - { id: platform, description: "NVS, task table, link state and the pure-C codec" }

layers:
  - { id: l4_app, description: Init order and the supervisor }
  - { id: l3_services, description: "MQTT, board link, NTRIP, commands, OTA, state, metrics" }
  - { id: l2_codecs, description: "Pure C, no ESP-IDF or FreeRTOS includes, host-tested" }
  - { id: l1_links, description: "Modem and PPP, board UART" }
  - { id: l0_platform, description: "Pins, NVS, task table, link state" }

components:
  - { id: app_main, subsystem: app, layer: l4_app, path: main, sources: [main/app_main.c], description: Init order only, depends_on: [supervisor] }
  - id: supervisor
    subsystem: app
    layer: l4_app
    path: main
    sources: [main/supervisor.*]
    description: Link state machine, recovery ladder, OTA confirm and report
    depends_on: [gw_link, mqtt_link, cell, ota, gwstate, metrics, ntrip]
  - { id: mqtt_link, subsystem: server_link, layer: l3_services, path: main, sources: [main/mqtt_link.*], description: esp-mqtt client and route table, depends_on: [devcert, usage, gw_link] }
  - { id: board_link, subsystem: autopilot_link, layer: l3_services, description: "Board link to the autopilot (planned, rmx-mower-gateway#62)", depends_on: [bl_uart, mqtt_link, rmx_codec, gw_link] }
  - { id: ntrip, subsystem: autopilot_link, layer: l3_services, path: main, sources: [main/ntrip.*], description: NTRIP client, depends_on: [board_link, settings, gw_link, rmx_codec] }
  - { id: remote_cmd, subsystem: server_link, layer: l3_services, path: main, sources: [main/remote_cmd.*], description: "Command queue, registry and acks", depends_on: [mqtt_link, rmx_codec] }
  - { id: ota, subsystem: server_link, layer: l3_services, path: main, sources: [main/ota.*], description: Firmware download over MQTT, depends_on: [mqtt_link, remote_cmd, rmx_codec] }
  - { id: gwstate, subsystem: app, layer: l3_services, path: main, sources: [main/gwstate.*], description: "Boot counter, clock, gateway/state fields", depends_on: [settings] }
  - { id: metrics, subsystem: server_link, layer: l3_services, path: main, sources: [main/metrics.*], description: Metric catalogue and telemetry, depends_on: [mqtt_link] }
  - { id: monitor, subsystem: server_link, layer: l3_services, path: main, sources: [main/monitor.*], description: Monitor sessions }
  - { id: usage, subsystem: server_link, layer: l3_services, path: main, sources: [main/usage.*], description: Byte counters per link and topic }
  - { id: devcert, subsystem: server_link, layer: l3_services, path: main, sources: [main/devcert.*, main/creds.*], description: "Device key, CSR, provisioning console", depends_on: [settings], hardware: [uart0_console] }
  - { id: rmx_codec, subsystem: platform, layer: l2_codecs, path: components/rmx_codec, description: "COBS, CRC-16, frames, firmware chunks, commands, NTRIP codec, recovery" }
  - { id: cell, subsystem: cellular, layer: l1_links, path: main, sources: [main/cell.*], description: "esp_modem DCE, PPP, AT sessions, redial", depends_on: [board, gw_link], hardware: [sim7600] }
  - { id: bl_uart, subsystem: autopilot_link, layer: l1_links, description: Board link UART driver (planned), hardware: [uart2_board] }
  - { id: board, subsystem: cellular, layer: l0_platform, path: main, sources: [main/board.*], description: "Pins, PWRKEY pulse, status LED", hardware: [gpio_board] }
  - { id: settings, subsystem: platform, layer: l0_platform, path: main, sources: [main/settings.*], description: The only NVS opener }
  - { id: gw_tasks, subsystem: platform, layer: l0_platform, path: main, sources: [main/gw_tasks.*], description: Task table and liveness counters }
  - { id: gw_link, subsystem: platform, layer: l0_platform, path: main, sources: [main/gw_link.*], description: Link-state bits and GW_EVENT edges }

tasks:
  - { id: ntrip, component: ntrip, priority: 6, stack: 4096 }
  - { id: cell_wd, component: cell, priority: 5, stack: 4096 }
  - { id: remote_cmd, component: remote_cmd, priority: 4, stack: 6144 }
  - { id: supervisor, component: supervisor, priority: 3, stack: 6144 }
  - { id: gw_tick, component: metrics, priority: 3, stack: 6144 }
  - { id: ota, component: ota, priority: 3, stack: 12288 }
  - { id: devcert, component: devcert, priority: 3, stack: 6144 }
  - { id: gw_signal, component: metrics, priority: 2, stack: 4096 }
